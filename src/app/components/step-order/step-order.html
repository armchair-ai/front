<div
    class="step-order-wrapper"
    [class.dir-left]="direction() === 'left'"
    [class.dir-right]="direction() === 'right'"
>
    <div
        class="step-order-shape"
        [style.background]="backgroundGradient()"
        [style.width]="width()"
        [style.height]="height()"
    ></div>
</div>
